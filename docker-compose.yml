# =============================================================================
# 研析通 v2.0 — full local stack: app + Neo4j + Redis + Jaeger + Prometheus + Grafana
# Usage:  docker compose up -d --build
# Set DASHSCOPE_API_KEY in a .env file next to this compose file.
# =============================================================================

name: yanxitong

services:
  # --- Knowledge graph -------------------------------------------------------
  neo4j:
    image: neo4j:5-community
    container_name: yxt-neo4j
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks: [yxt-net]

  # --- Cache / queue ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: yxt-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks: [yxt-net]

  # --- Application -------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: yxt-app
    ports:
      - "8001:8001"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      REDIS_URL: redis://redis:6379/0
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      YXT_CONFIG_PATH: /app/config.yaml
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: yanxitong
    volumes:
      - app-data:/app/data          # faiss indexes / uploaded documents
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [yxt-net]

  # --- Distributed tracing (OTLP) ------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.63.0
    container_name: yxt-jaeger
    ports:
      - "16686:16686"   # Web UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory
    restart: unless-stopped
    networks: [yxt-net]

  # --- Metrics --------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.13.3
    container_name: yxt-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    restart: unless-stopped
    networks: [yxt-net]

  # --- Dashboards ---------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.6.1
    container_name: yxt-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks: [yxt-net]

volumes:
  neo4j-data:
  neo4j-logs:
  redis-data:
  app-data:
  prometheus-data:
  grafana-data:

networks:
  yxt-net:
    driver: bridge
