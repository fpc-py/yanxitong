# =============================================================================
# 研析通 (YanXiTong) v3.0 — central runtime configuration
#
# 生效优先级（低 → 高）：代码默认值 < 本文件 < .env < 真实环境变量。
# 注意：键名必须与 src/core/config.py 中对应 Config 类的字段完全一致才会生效
# （所有 block 均为 extra="ignore"，名字不匹配的键会被静默忽略）。
# Secrets (API keys / passwords) are injected via environment variables,
# never stored in this file. See docker-compose.yml for wiring.
# =============================================================================

app:
  name: yanxitong                # 文档用途（无对应字段）
  version: "3.0.0"               # 文档用途（无对应字段）
  env: dev                       # 文档用途（无对应字段）
  host: 0.0.0.0
  port: 8001
  log_level: info

# --- LLM: model routing table --------------------------------------------------
# 生效字段仅 model 名 / temperature / max_tokens / dashscope_api_key；
# provider、base_url、default、routing 目前为文档说明（base_url 在
# src/core/llm_factory.py 中按 DashScope 兼容端点硬编码）。
llm:
  provider: dashscope            # OpenAI-compatible endpoint of Alibaba Cloud
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_env: DASHSCOPE_API_KEY
  default:
    temperature: 0.3
    max_tokens: 4096
    timeout_seconds: 120
    max_retries: 2
  routing:
    supervisor:                  # task decomposition / orchestration
      model: qwen-max
      temperature: 0.2
      max_tokens: 4096
    lightweight:                 # classification, extraction, reranking glue
      model: qwen3.8-flash
      temperature: 0.1
      max_tokens: 1024
    deep_reasoning:              # experiment design, statistical reasoning
      model: deepseek-v4-pro
      temperature: 0.5
      max_tokens: 8192
    coder:                       # data analyst python code generation
      model: qwen3-coder-flash
      temperature: 0.1
      max_tokens: 4096
  coder: qwen3-coder-flash       # 生效字段（LLMConfig.coder；上表为文档说明）

# --- Retrieval: 三源（arXiv / Semantic Scholar / OpenAlex）+ 向量索引 ------------
retriever:
  # 本地已下载的 BGE-M3 模型目录（RetrieverConfig.embedding_model）
  embedding_model: d:/aafpc/yanxitong/models/models/BAAI--bge-m3/snapshots/master
  vector_dim: 1024
  top_k: 8                       # GraphRAG 融合检索返回条数
  index_path: data/faiss
  reranker_model:   # 留空=禁用精排；填 bge-reranker-v2-m3 本地路径即启用（B1 已留接口）
  reranker_candidates: 20         # 论文 FAISS 索引目录（index.faiss + docs.json）
  index_max_papers: 20           # 每轮问答最多编码入库的论文数（CPU 上 BGE 编码是链路最慢段）
  arxiv_max_results: 20
  semantic_scholar_max_results: 20
  openalex_max_results: 20
  openalex_mailto: ""            # 可选：填邮箱进入 OpenAlex polite pool
  openalex_api_key: ""           # 可选：免费注册可提升额度；留空走匿名额度

# --- MCP layer for paper sources -----------------------------------------------
mcp:
  transport: memory              # memory（进程内 FastMCP，默认，最稳）| stdio（子进程）
  server_timeout_seconds: 30

# --- Per-paper structured extraction budget --------------------------------------
extraction:
  max_papers: 25                 # 每次检索对相关度靠前的 N 篇做 6 字段抽取
  concurrency: 5                 # 并发 LLM 抽取上限

# --- PDF ingestion chain: PyMuPDF(主) -> OCR(扫描件/低质量兜底) -------------------
pdf:
  ocr_enabled: true
  ocr_max_pages: 20
  min_chars_per_page: 100        # 低于该密度或乱码率过高视为解析质量差，触发 OCR

# --- User-built knowledge base（共享/私有双区） ------------------------------------
kb:
  max_upload_mb: 20
  chunk_size: 800
  chunk_overlap: 100
  ner_max_chunks: 5              # 每篇上传文档抽实体所用的前置块数

# --- Knowledge graph construction -------------------------------------------------
# entity_types / relation_types 是封闭 schema 的唯一权威来源：
# 抽取提示词由它们生成，写入前代码级 gate 也会丢弃白名单外的类型。
kg:
  entity_types:
    - ResearchProblem
    - Method
    - Dataset
    - Model
    - Metric
    - Finding
    - Author
    - Venue
    - Experiment
  relation_types:
    - PROPOSES
    - USES_DATASET
    - USES_METRIC
    - EVALUATED_ON
    - OUTPERFORMS
    - IMPROVES_ON
    - BASED_ON
    - EXTENDS
    - COMPARES_WITH
    - APPLIED_TO
    - CITES
    - CONTRADICTS
    - ACHIEVES
  max_entities_per_doc: 60
  max_papers: 25                  # LLM 关系补充上限（确定性边不受此限制）
  concurrency: 5
  build_enabled: true             # 总开关：关闭后所有图谱写入跳过（回滚杠杆）
  llm_relation_pass: true         # LLM 补充实体间关系；确定性边始终生成
  hops: 2                         # GraphRAG 邻域展开深度
  context_chars: 1800             # 融合上下文中图谱段字符预算
  review_sample_rate: 0.1         # 按 edge_key 确定性抽取人工复核的比例

# --- Data analyst pipeline（画像/召回/校验/打包预算） ---------------------------------
analysis:
  max_runs: 5                    # 每会话保留的产出包数量（旧 run 目录自动清理）
  recall_top_k: 6                # 每个知识库（绘图/方法/期刊/教材）召回块数
  deep_verify: true              # 是否执行 LLM 校验层（假设适用性 + 叙述一致性）
  profile_timeout: 15            # 沙箱画像脚本超时（秒）

# --- Experiment designer engine（证据检索/多目标优化/校验/打包预算） --------------------
designer:
  max_runs: 5                    # 每会话保留的设计产出包数量
  recall_top_k: 6                # 每知识库（含实验设计库）召回块数
  n_trials: 64                   # Optuna 多目标搜索 trial 预算
  top_k: 3                       # Top-K 推荐方案数量
  deep_verify: true              # 是否执行 LLM 复核层（主张-证据一致性）
  max_gpu_hours: 24.0            # 未声明资源时的默认 GPU 时预算（资源剪枝用）
  max_memory_gb: 16.0            # 未声明资源时的默认显存/内存预算（GB）
  weights:                       # 六维排序权重（使用时归一化）
    performance: 0.40
    cost: 0.18
    time: 0.12
    interpretability: 0.10
    risk: 0.12
    complexity: 0.08

# --- Sandboxed code execution (data analyst agent) ---------------------------------
sandbox:
  image: yanxitong-sandbox:2.1   # 2.1 = pyarrow（Parquet 支持）+ 产物回收升级
  memory_limit: 512m
  cpu_limit: 1.0
  timeout: 30
  network_disabled: true

# --- Answer safety / quality gates --------------------------------------------------
safety:
  confidence_threshold: 0.6
  self_consistency_samples: 3

# --- Semantic answer cache ------------------------------------------------------------
cache:
  ttl: 3600
  similarity_threshold: 0.92

# --- Accounts, tokens and anonymous trial quota ---------------------------------------
# 用户/令牌/匿名配额存于 MySQL（docker compose up -d mysql 即可，宿主端口 3309）。
# 演示口径：未登录可免费问答 anonymous_limit 次；登录后以账号身份提问，不占用匿名配额。
auth:
  enabled: true
  anonymous_limit: 5            # 未登录免费问答次数（仅计「问答」：建会话提问 + 继续提问）
  token_ttl_days: 7             # 登录令牌有效期
  username_min_length: 2
  username_max_length: 32
  password_min_length: 6

mysql:
  host: 127.0.0.1               # compose 内 app 服务用 MYSQL_HOST=mysql 覆盖
  port: 3309                    # compose 将容器 3306 映射到宿主 3309，避开本机 MySQL
  user: yanxitong
  password: yanxitong           # 生产环境请用 MYSQL_PASSWORD 环境变量覆盖
  database: yanxitong

redis:
  url: redis://127.0.0.1:6380/0  # compose 内 app 服务用 REDIS_URL=redis://redis:6379 覆盖
  # 宿主 6380 才是本项目的 redis 容器；6379 被本机其他项目占用。
  # Redis 不可达时语义缓存自动降级为进程内字典，不阻塞问答。

# --- API rate limiting ------------------------------------------------------------------
rate_limit:
  requests_per_minute: 60

# --- Observability（文档用途：对应代码直接读环境变量，暂不读本块） -------------------------
observability:
  tracing:
    enabled: true
    otlp_endpoint_env: OTEL_EXPORTER_OTLP_ENDPOINT   # -> Jaeger (4317)
    service_name: yanxitong
  metrics:
    enabled: true
    path: /metrics
